# Deploy static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare publish directory
        run: |
          shopt -s nullglob
          mkdir -p _site/styles _site/js _site/assets/img _site/assets/research _site/resumes

          cp index.html projects.html resume.html contact.html robots.txt sitemap.xml _site/
          cp styles/*.css _site/styles/
          cp js/*.js _site/js/

          cp assets/img/*.{webp,jpg,svg,ico} _site/assets/img/

          cp assets/research/IMDB_Research_paper.pdf assets/research/RNN.pdf _site/assets/research/

          cp "resumes/Tianren_Chen_Resume.pdf" _site/resumes/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
